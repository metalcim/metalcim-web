   # Publica la carpeta site/ en el hosting (HostGator) cada vez que cambia main.
   # Usa una cuenta FTP limitada a public_html. Usuario, contraseña y servidor
   # viven en Settings > Secrets and variables > Actions; nunca en este archivo.
   name: Publicar sitio

   on:
     push:
       branches: [main]
       paths: ["site/**"]
     workflow_dispatch:

   concurrency:
     group: publicar-sitio
     cancel-in-progress: false

   jobs:
     publicar:
       runs-on: ubuntu-latest
       steps:
         - name: Descargar el repositorio
           uses: actions/checkout@v4

         - name: Subir site/ a public_html
           uses: SamKirkland/FTP-Deploy-Action@v4.3.5
           with:
             server: ${{ secrets.FTP_SERVER }}
             username: ${{ secrets.FTP_USERNAME }}
             password: ${{ secrets.FTP_PASSWORD }}
             protocol: ftps
             local-dir: ./site/
             server-dir: ./
