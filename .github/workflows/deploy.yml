# Publica la carpeta site/ en el hosting (HostGator) cada vez que cambia main.
# Usa una cuenta FTP limitada a public_html. Usuario, contraseña y servidor
# viven en el Environment "produccion" (Settings > Environments), que solo
# acepta la rama main. Nunca en este archivo.
name: Publicar sitio

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-sitio
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Subir site/ a public_html
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ./
